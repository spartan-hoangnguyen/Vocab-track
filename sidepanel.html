<!doctype html>
<meta charset="utf-8">
<title>Vocab-track</title>
<link rel="stylesheet" href="sidepanel.css">
<body>
  <nav>
    <button id="tab-word" class="active">Word</button>
    <button id="tab-page">On this page</button>
    <button id="tab-quiz">Quiz</button>
  </nav>

  <p class="dashlink"><button id="open-dashboard">Open dashboard →</button></p>

  <section id="view-word">
  <p id="lookup-empty">Select a word on any page and click the button that appears.</p>

  <article id="entry" hidden>
    <h1 id="entry-word"></h1>
    <p class="meta">
      <span id="entry-level" class="level"></span>
      <span id="entry-pos"></span>
      <span id="entry-gram"></span>
    </p>
    <div class="prons" id="entry-prons"></div>
    <p id="entry-vi" class="vi"></p>

    <section class="block" id="entry-context-block" hidden>
      <h2>Seen in</h2>
      <blockquote id="entry-context"></blockquote>
    </section>

    <p class="links" id="entry-links"></p>

    <!-- Filing the word while you still remember why you looked it up. The
         suggestions are a native datalist: your folders plus the presets. -->
    <section class="block">
      <h2>Topics</h2>
      <div class="chips" id="entry-tags"></div>
      <input id="entry-tag-q" class="tagq" list="entry-tag-options" maxlength="40"
             autocomplete="off" placeholder="Add a topic…">
      <datalist id="entry-tag-options"></datalist>
    </section>

    <section class="block">
      <h2 id="entry-senses-title">Meaning</h2>
      <ol id="entry-senses"></ol>
    </section>

    <div id="entry-groups"></div>

    <p id="entry-warn" class="warn" hidden></p>
  </article>
  </section>

  <section id="view-page" hidden>
    <button id="speed-read" class="readbtn">Speed-read this page</button>
    <p class="pagehead" id="page-head"></p>
    <ul id="page-list"></ul>
    <p id="page-empty" class="muted" hidden></p>
  </section>

  <section id="view-quiz" hidden>
    <p id="quiz-empty" class="muted" hidden></p>

    <div id="quiz-card" hidden>
      <p class="quizask">What does <b id="quiz-word"></b> mean?</p>
      <ol id="quiz-options"></ol>
      <p id="quiz-verdict" hidden></p>
      <p class="quizafter">
        <button id="quiz-full" hidden>Full entry →</button>
        <button id="quiz-next" hidden>Next word</button>
      </p>
    </div>
  </section>

  <script src="lib.js"></script>
<script src="lang/lang.js"></script>
<script src="lang/en/index.js"></script>
<script src="lang/en/dictionary.js"></script>
  <script src="store.js"></script>
  <script src="lookup.js"></script>
  <script src="sidepanel.js"></script>
</body>
