<body>
<!-- display:contents, so this wrapper adds no box of its own. dashboard.css
     lays the page out as a flex body with <aside> and <main> as its direct
     children; an ordinary <div> between them breaks that, and a probe whose
     whole job is measuring layout would then be measuring a box tree the
     product never renders. -->
<style>#app{display:contents}</style>
<div id="app"></div>
<script>
  // A probe that dies silently reports nothing and reads as a pass to anyone
  // skimming. Surface it in the one place run.sh looks.
  const died = (what) => {
    document.getElementById('out').textContent =
      'FAIL probe ' + what + '\n1 failure(s), 0 check(s)';
  };
  window.addEventListener('error', (e) => died('threw: ' + e.message + ' @' + e.filename + ':' + e.lineno));
  // Both, because the assertions run in an async callback: a throw in there is
  // a rejected promise, which never reaches the error event. Without this the
  // page sits on "running…" and run.sh reports nothing at all.
  window.addEventListener('unhandledrejection', (e) => died('rejected: ' + (e.reason?.stack ?? e.reason)));
</script>
<!-- The markup is the real dashboard.html, fetched rather than copied.
     It used to be a copy, and the copy silently went stale the moment the
     review card changed shape — a probe measuring markup the product no longer
     ships cannot catch anything. -->
<script>
  // dashboard.js binds its listeners at load, so the markup has to be in the
  // document before it runs. That ordering is why this page loads lib/store/
  // lookup/dashboard itself, at the bottom, instead of with <script src>: a
  // synchronous XMLHttpRequest would give the same ordering but stalls
  // headless Chrome's virtual clock, so the assertions' timer never fired and
  // the page sat on "running…" reporting nothing.
  const ready = fetch('../dashboard.html')
    .then((r) => r.text())
    .then((page) => {
      // Only what is inside <body>, and with its <script> tags stripped: this
      // page loads those itself, after the chrome stub exists.
      //
      // Appended, never assigned to document.body.innerHTML: replacing the
      // body while the parser is still inside it throws away every tag not yet
      // read, which silently took out this page's own scripts.
      const holder = document.createElement('div');
      holder.innerHTML =
        page.slice(page.indexOf('<body>') + 6, page.lastIndexOf('</body>'))
            .replace(/<script[\s\S]*?<\/script>/g, '');
      // Into a slot declared up front, not appended to the body. The fetch
      // resolves after parsing finishes, so appending would put the whole
      // dashboard after the results element at the foot of this page — and
      // run.sh reads the results by slicing between that element's tags, so it
      // would print the dashboard instead of the assertions.
      document.getElementById('app').replaceChildren(...holder.childNodes);
    })
    .then(() => { return ['../lib.js', '../lang/lang.js', '../lang/en/index.js', '../lang/ko/index.js', '../lang/zh/index.js', '../lang/en/cefr.js', '../lang/en/dictionary.js', '../lang/ko/dictionary.js', '../store.js', '../lookup.js', '../giphy.js', '../practice.js',
      ...['quiz', 'listening', 'fill', 'speak', 'blast', 'mix'].map((m) => `../practice-${m}.js`),
      '../dashboard.js']
      // Serial, not Promise.all: dashboard.js reads VT from lib.js at load.
      .reduce((chain, src) => chain.then(() => new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = () => reject(new Error('could not load ' + src));
        document.head.append(tag);
      })), Promise.resolve()); });
</script>

<script>
const WORDS = {};
const seed = [
  ['strategy','B2','ˈstræt.ə.dʒi','chiến lược','a detailed plan for achieving success in situations such as war, business or politics'],
  ['resilient','C1','rɪˈzɪl.i.ənt','kiên cường','able to quickly return to a previous good condition'],
  ['ubiquitous','C2','juːˈbɪk.wɪ.təs','phổ biến','seeming to be everywhere at the same time'],
  ['commemorate','C1','kəˈmem.ə.reɪt','tưởng niệm','to remember officially and give respect to a great person or event'],
  ['tentative','B2','ˈten.tə.tɪv','dè dặt','not certain or agreed, or uncertain and slightly nervous'],
  ['ambiguous','C1','æmˈbɪɡ.ju.əs','mơ hồ','having more than one possible meaning'],
  ['leverage','B2','ˈliː.vər.ɪdʒ','đòn bẩy','to use something you already have in order to achieve something new'],
  ['nuance','C1','ˈnjuː.ɑːns','sắc thái','a very slight difference in appearance, meaning or sound'],
  ['pragmatic','C1','præɡˈmæt.ɪk','thực dụng','solving problems in a sensible way that suits the conditions'],
  ['candid','C1','ˈkæn.dɪd','thẳng thắn','truthful and honest, especially about something difficult'],
  ['scarce','B2','skeəs','khan hiếm','not easy to find or get']
];
for (const [word, level, ipa, vi, def] of seed) {
  WORDS[word] = { word, level, ipa, vi, def, folders:['reading'], senses:[], synonyms:[], related:[],
    context: word === 'strategy'
      ? 'The company announced a new long-term strategy for the European market this morning.' : null,
    sources:['https://example.com/a'], added: Date.now() - 86400000,
    ease:2.5, interval:0, reps:0, due: Date.now() - 1000 };
}
const listeners = [];
// A real chrome.storage.local, minus persistence: get takes a key or an array
// of them and omits what is absent, which is the whole point of the writeOn
// tests — `{}` back from get is what "the user has never touched this" looks like.
const STORE = { words: WORDS };
window.chrome = {
  storage:{ local:{
      get: async (keys) => {
        const out = {};
        for (const k of (Array.isArray(keys) ? keys : [keys])) {
          if (k in STORE) out[k] = STORE[k];
        }
        return out;
      },
      set: async (patch) => { Object.assign(STORE, patch); } },
    onChanged:{ addListener:(f)=>listeners.push(f) } },
  runtime:{ sendNativeMessage: async () => { throw new Error('no host'); },
            sendMessage(){}, onMessage:{ addListener(){} } }
};
</script>

<script>
// Braced, so every helper below is block-scoped. These names sit in the same
// global script scope as lib.js, store.js, lookup.js and dashboard.js, and a
// bare `check` in this file collided with one added to dashboard.js — a
// SyntaxError that takes out the whole page rather than failing one assertion.
{
let failures = 0;
const log = [];
const check = (name, cond, detail) => {
  if (cond) log.push('PASS  ' + name);
  else { failures++; log.push('FAIL  ' + name + (detail ? '  -> ' + detail : '')); }
};
const cs = (el) => getComputedStyle(el);

// The markup and the four scripts are all fetched, so the assertions wait on
// that chain; the short timer after it is for the dashboard's own first render.
ready.then(() => setTimeout(async () => {
  /* ---- view switching ----
     The trap this guards: any author `display` on a view section beats the UA
     stylesheet's [hidden]{display:none}, so #view-review{display:flex} without
     a :not([hidden]) makes the review card render on top of every other view. */
  for (const target of VIEWS) {
    showView(target);
    for (const other of VIEWS) {
      const el = document.getElementById(`view-${other}`);
      const shown = cs(el).display !== 'none';
      check(`showView(${target}) ${other === target ? 'shows' : 'hides'} ${other}`,
            shown === (other === target), `display: ${cs(el).display}`);
    }
  }

  /* ---- the top bar must not offer Review while you are reviewing ---- */
  showView('review');
  check('the review CTA is hidden inside the review', document.getElementById('review-btn').hidden);
  showView('overview');
  check('the review CTA is back outside it', !document.getElementById('review-btn').hidden);

  /* ---- the search placeholder must not run under the shortcut badge ---- */
  const input = document.getElementById('q');
  const badge = document.querySelector('.search .kbd');
  const textEdge = input.getBoundingClientRect().right
    - parseFloat(cs(input).paddingRight);
  check('the search field reserves room for the ⌘K badge',
        textEdge <= badge.getBoundingClientRect().left + 1,
        `text ends at ${textEdge.toFixed(1)}, badge starts at ${badge.getBoundingClientRect().left.toFixed(1)}`);

  /* ---- the review card must use the viewport, not float in its top third ---- */
  startReview(null);
  showView('review');
  render();
  const card = document.getElementById('rv-card').getBoundingClientRect();
  const above = card.top;
  const below = window.innerHeight - card.bottom;
  check('the review card is on screen', card.height > 0 && card.top < window.innerHeight);
  // Centred, not top-anchored: before this work the card sat under the heading
  // with roughly three times as much empty space below it as above.
  check(`the review card is vertically centred (${above.toFixed(0)}px above, ${below.toFixed(0)}px below)`,
        Math.abs(above - below) < Math.max(above, below) * 0.6,
        `above ${above.toFixed(0)}, below ${below.toFixed(0)}`);

  /* ---- the typing card ----
     The prompt is the meaning and the answer is the word, so the single thing
     that must never be true is the word being on screen before you commit. */
  const cardBox = document.getElementById('rv-card');
  const typeBox = document.getElementById('rv-input');
  const wordEl = document.getElementById('rv-word');
  const answer = document.getElementById('rv-answer');

  check('the typing box is on the card and focused',
        !!typeBox && cs(document.getElementById('rv-type')).display !== 'none'
        && document.activeElement === typeBox,
        document.activeElement?.id);
  check('the answer block is hidden before you commit', answer.hidden);
  check('the word itself is not on screen', wordEl.textContent === '', JSON.stringify(wordEl.textContent));
  check('neither is its pronunciation',
        document.getElementById('rv-ipa').hidden && document.getElementById('rv-play').hidden);
  // The Cambridge URL spells the word out, so the link must not be reachable
  // — nor carry the answer — until the card has been committed.
  check('the Cambridge link is not on screen before you commit',
        !document.getElementById('rv-cam').checkVisibility());
  check('and it is not pointing at the word yet',
        !/strategy/.test(document.getElementById('rv-cam').href),
        document.getElementById('rv-cam').href);
  check('the full entry is not on screen either',
        !document.getElementById('rv-full').checkVisibility());
  // Skip is the one control that works from the prompt side.
  check('but Skip is', document.getElementById('rv-skip').checkVisibility());
  // A prompt containing its own answer is not a prompt. Every card here is
  // seeded from `strategy`, whose saved sentence uses the word.
  const shownContext = document.getElementById('rv-context').textContent;
  check('the saved sentence has the word masked out',
        !shownContext || !/\bstrategy\b/i.test(shownContext), shownContext);
  check('the typing row takes the card width, unlike the grade buttons',
        typeBox.getBoundingClientRect().width > cardBox.clientWidth * 0.4,
        `${typeBox.getBoundingClientRect().width.toFixed(0)}px of ${cardBox.clientWidth}px`);

  // Commit a wrong-but-close answer and read what the card says back.
  typeBox.value = 'strategyy';
  document.getElementById('rv-type').dispatchEvent(new Event('submit', { cancelable: true }));
  await new Promise((r) => setTimeout(r, 20));

  check('committing reveals the answer block', !answer.hidden);
  check('and the word', document.getElementById('rv-word').textContent.length > 0,
        document.getElementById('rv-word').textContent);
  // Computed display, not the .hidden property: the property was true the whole
  // time the row was still on screen, because an author display:flex outranks
  // the UA [hidden] rule. Asserting the property tested nothing.
  check('and the typing row is gone',
        cs(document.getElementById('rv-type')).display === 'none',
        cs(document.getElementById('rv-type')).display);
  const diff = document.getElementById('rv-diff');
  check('the diff marks only the wrong letters',
        diff.querySelectorAll('u').length === 1 && diff.querySelector('u').textContent === 'y',
        `${diff.querySelectorAll('u').length} marks, ${JSON.stringify(diff.querySelector('u')?.textContent)}`);
  check('a one-letter slip reads as almost, not as wrong',
        diff.className.includes('near'), diff.className);
  // Typing already said how well it went, so Enter has a grade to take.
  const picked = document.querySelectorAll('#rv-grades button.pick');
  check('exactly one grade is marked as the one Enter takes', picked.length === 1, picked.length);
  check('a near miss suggests Hard, not Good',
        picked[0]?.querySelector('b').textContent === 'Hard',
        picked[0]?.querySelector('b').textContent);
  check('every grade still carries its own key',
        [...document.querySelectorAll('#rv-grades button')].length === 4
        && [...document.querySelectorAll('#rv-grades button kbd')].length === 5,
        `${document.querySelectorAll('#rv-grades button kbd').length} keys`);
  // The box must not keep focus once the grades are live, or 1-4 would type
  // digits into it instead of grading.
  check('focus leaves the box so the number keys can grade',
        document.activeElement !== typeBox, document.activeElement?.id);

  /* ---- the answer side: Cambridge, and everything the entry already knows ---- */
  check('the Cambridge link appears with the answer',
        document.getElementById('rv-cam').checkVisibility());
  check('and points at this card’s word',
        new URL(document.getElementById('rv-cam').href).pathname.endsWith('/strategy'),
        document.getElementById('rv-cam').href);
  // Every seeded word has empty senses/synonyms, so the drawer has nothing to
  // hold: an empty drawer is worse than no drawer.
  check('a thin entry offers no full-entry drawer', document.getElementById('rv-full').hidden);

  // queue[0] is the same object as WORDS.strategy, so enriching it here is
  // what the entry would look like straight out of parseCambridge.
  WORDS.strategy.senses = [
    { level: 'B2', def: 'a detailed plan', example: null },
    { level: 'C1', def: 'the art of planning a war', example: 'military strategy' }
  ];
  WORDS.strategy.synonyms = ['plan', 'approach'];
  WORDS.strategy.opposites = [];
  renderCard();
  const full = document.getElementById('rv-full');
  check('a rich entry does offer one', !full.hidden);
  check('it holds the meanings the prompt had no room for',
        full.querySelectorAll('#rv-full-body li').length === 1
        && /art of planning/.test(full.querySelector('#rv-full-body li').textContent),
        full.querySelector('#rv-full-body li')?.textContent);
  check('the first sense is not repeated in it',
        !/detailed plan/.test(document.getElementById('rv-full-body').textContent));
  check('and the synonyms, as chips',
        full.querySelectorAll('#rv-full-body .tag').length === 2);
  check('an empty group is not given a heading',
        !/Opposites/.test(document.getElementById('rv-full-body').textContent));
  // Remembered across cards: renderCard rebuilds on every grade.
  full.open = true;
  full.dispatchEvent(new Event('toggle'));
  renderCard();
  check('the drawer stays open on the next render', document.getElementById('rv-full').open);

  /* ---- Skip: out of the rotation, still in the collection ---- */
  startReview(null);
  renderCard();
  const before = queue.length;
  const skipped = queue[0].word;
  await skipCard();
  check('skipping takes the card out of the queue',
        queue.length === before - 1 && !queue.some((e) => e.word === skipped),
        `${before} -> ${queue.length}`);
  check('and records it', STORE.words[skipped].skipped === true);
  check('and it is not counted as due any more',
        !dueCount(Object.values(STORE.words).filter((e) => e.word === skipped)));
  check('nor as a new card',
        !newCards(Object.values(STORE.words).filter((e) => e.word === skipped)).length);
  startReview(null);
  check('a fresh session never offers it again',
        !queue.some((e) => e.word === skipped));
  check('but the word is still in the collection', !!STORE.words[skipped]);

  // Un-skipping is the only way back, and it lives on the word card.
  await refresh();
  const backTag = [...document.querySelectorAll('#w-cards .tag.clickable')]
    .find((t) => t.textContent.startsWith('Skipped'));
  check('All words offers the way back', !!backTag);
  backTag?.click();
  await new Promise((r) => setTimeout(r, 30));
  check('clicking it puts the word back in the rotation',
        STORE.words[skipped].skipped === false);
  startReview(null);
  check('and the next session asks about it again',
        queue.some((e) => e.word === skipped));

  /* ---- tags: file the word you just learnt under a topic ---- */
  const tick = () => new Promise((r) => setTimeout(r, 30));
  const enterIn = (node) => node.dispatchEvent(
    new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  startReview(null);
  showView('review');
  renderCard();
  const tagBtn = document.getElementById('rv-tag');
  // A topic name before the answer would be a hint.
  check('the tag button waits for the answer', !tagBtn.checkVisibility());
  submitAnswer();
  check('and appears with it', tagBtn.checkVisibility());
  const tagWord = queue[0].word;
  const tagDlg = document.getElementById('tag-dlg');
  const tagQ = document.getElementById('tag-q');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 't', cancelable: true }));
  check('t opens the tag picker', tagDlg.open);
  check('a fresh profile is offered every preset topic',
        document.querySelectorAll('#tag-list .tagrow.suggested').length === VT.TOPICS.length,
        String(document.querySelectorAll('#tag-list .tagrow.suggested').length));
  check('but none of them is a folder yet', !STORE.folders?.t_politics);

  const queued = queue.length;
  document.dispatchEvent(new KeyboardEvent('keydown', { key: '3', cancelable: true }));
  await tick();
  check('a number key while the picker is open does not grade the card',
        queue.length === queued && queue[0]?.word === tagWord && !STORE.words[tagWord].reps);

  tagQ.value = 'polit';
  tagQ.dispatchEvent(new Event('input'));
  enterIn(tagQ);
  await tick();
  check('Enter on a partial name files the word under that topic',
        STORE.words[tagWord].folders.includes('t_politics'), STORE.words[tagWord].folders.join());
  check('and the preset becomes a real folder', STORE.folders?.t_politics?.name === 'Politics & Government');
  check('which is no longer offered as a suggestion',
        [...document.querySelectorAll('#tag-list .tagrow.suggested')]
          .every((row) => !/Politics/.test(row.textContent)));

  tagQ.value = 'IELTS Task 2';
  tagQ.dispatchEvent(new Event('input'));
  check('a name nobody has used offers to create it',
        /Create “IELTS Task 2”/.test(document.querySelector('#tag-list .create')?.textContent));
  enterIn(tagQ);
  await tick();
  const made = Object.values(STORE.folders).find((f) => f.name === 'IELTS Task 2');
  check('Enter on it makes the folder', !!made && made.id.startsWith('f_'));
  check('and files the word there', !!made && STORE.words[tagWord].folders.includes(made.id));
  check('both tags show as ticked',
        document.querySelectorAll('#tag-list input:checked').length === 2,
        String(document.querySelectorAll('#tag-list input:checked').length));

  [...document.querySelectorAll('#tag-list .tagrow')]
    .find((row) => /Politics/.test(row.textContent))?.querySelector('input').click();
  await tick();
  check('unticking takes the word out again', !STORE.words[tagWord].folders.includes('t_politics'));
  check('but leaves the folder', !!STORE.folders.t_politics);

  enterIn(tagQ);   // empty box: Enter closes
  await tick();
  check('Enter on an empty box closes the picker', !tagDlg.open);
  check('the card now says where the word is filed',
        /IELTS Task 2/.test(tagBtn.textContent) && !/Politics/.test(tagBtn.textContent), tagBtn.textContent);
  check('and the card is still waiting for its grade', revealed && queue[0]?.word === tagWord);

  /* ---- nav icons must be distinguishable from one another ---- */
  const icons = [...document.querySelectorAll('nav a svg')].map((el) => el.innerHTML);
  check('every nav item has its own icon',
        icons.length === 6 && new Set(icons).size === 6, `${new Set(icons).size} distinct of ${icons.length}`);

  /* ---- writing: the settings and the mistake list ----
     Driven through STORE + refresh() rather than the initial load, so each
     case states the storage it is asserting about. */
  const rows = () => [...document.querySelectorAll('#wr-mistakes li')];

  delete STORE.writeOn;
  delete STORE.writeOff;
  delete STORE.writeMistakes;
  await refresh();
  // The one that would ship the feature off for every existing profile.
  check('an absent writeOn renders the toggle as on', document.getElementById('wr-on').checked);
  check('an absent writeOff says checking is on everywhere',
        !document.getElementById('wr-hosts-empty').hidden
        && document.getElementById('wr-hosts').children.length === 0,
        `${document.getElementById('wr-hosts').children.length} host rows`);
  check('an absent writeMistakes shows the empty line and no panel',
        !document.getElementById('wr-mistakes-empty').hidden
        && document.getElementById('wr-mistakes').hidden,
        `${rows().length} rows`);

  STORE.writeOn = false;
  await refresh();
  check('writeOn false renders the toggle as off', !document.getElementById('wr-on').checked);

  STORE.writeOff = ['mail.google.com', 'docs.google.com'];
  await refresh();
  check('writeOff renders one removable row per host and hides the empty line',
        document.getElementById('wr-hosts').children.length === 2
        && document.getElementById('wr-hosts-empty').hidden
        && document.querySelectorAll('#wr-hosts .rowdel').length === 2);

  // 15 rules, counts 1..15, inserted in ascending order so insertion order is
  // the wrong answer and only a sort by n can pass.
  STORE.writeMistakes = {};
  for (let i = 1; i <= 15; i++) {
    STORE.writeMistakes[`RULE_${i}`] = { n: i, msg: `message ${i}`, cat: 'CONFUSED_WORDS' };
  }
  await refresh();
  const counts = rows().map((li) => Number(li.querySelector('.n').textContent));
  check('the mistake list caps at 12', counts.length === 12, `${counts.length} rows`);
  check('the mistake list is ordered by count, highest first',
        counts.length === 12 && counts[0] === 15
        && counts.every((n, i) => i === 0 || counts[i - 1] >= n),
        counts.join(','));
  check('the category is title-cased, not a raw rule id',
        rows()[0]?.querySelector('.tag').textContent === 'Confused Words',
        rows()[0]?.querySelector('.tag').textContent);
  // The count is the point of the panel; at body size it reads as a debug dump.
  check('the count reads as a stat, not as body text',
        parseFloat(cs(rows()[0].querySelector('.n')).fontSize) >= 20,
        cs(rows()[0].querySelector('.n')).fontSize);

  // An imported word list is thousands of entries. putWord reads and rewrites
  // the whole words map per call, so the import path has to batch — counting
  // the writes is the only way to catch a regression back to per-word saves,
  // which stays functionally correct and freezes the page.
  let writes = 0;
  const realSet = chrome.storage.local.set;
  chrome.storage.local.set = async (patch) => { writes++; return realSet(patch); };
  await putWords({
    strategy: { folders: ['reading', 'ielts-c1'] },
    aberration: { word: 'aberration', level: 'C2', folders: ['ielts-c2'], due: 1 }
  });
  chrome.storage.local.set = realSet;
  check('a bulk import writes the words map once, not once per word', writes === 1, String(writes));
  check('a bulk import patches an existing entry rather than replacing it',
        !!STORE.words.strategy.def && STORE.words.strategy.folders.includes('ielts-c1'));
  check('a bulk import adds an entry it has never seen', STORE.words.aberration?.level === 'C2');

  // 400 words, so the 300 cap has something to cut. A card is 16 elements, and
  // renderWords runs on every keystroke in the search box: uncapped, an
  // imported list rebuilds tens of thousands of nodes per keystroke.
  for (let i = 0; i < 400; i++) {
    STORE.words['bulkword' + i] = {
      word: 'bulkword' + i, level: 'C1', ipa: 'b', vi: 'từ', def: 'a word', folders: ['bulk-new'],
      senses: [], synonyms: [], related: [], context: null, sources: [],
      added: Date.now() - i, ease: 2.5, interval: 0, reps: 0, due: Date.now() + 1e9
    };
  }
  await refresh();
  const listed = document.getElementById('w-cards').children.length;
  check('the words list caps how many cards it builds', listed === 300, String(listed));
  check('the words list says the rest are there',

    const [r, g, b] = color.match(/[\d.]+/g).map(Number).map((v) => {

      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };

    const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);

  };

  /* ---- the toggle itself ---- */
  const seg = document.getElementById('lang-seg');
  const langSel = document.getElementById('lang-select');
  const choose = async (id) => {
    langSel.value = id;
    langSel.dispatchEvent(new Event('change'));
    await tick();
  };
  check('every registered pack is an option, named in its own language',
        !seg.hidden && [...langSel.options].map((o) => `${o.value}:${o.textContent}`).join()
          === 'en:English,ko:한국어,zh:中文',
        [...langSel.options].map((o) => `${o.value}:${o.textContent}`).join());
  check('and the active one is selected', langSel.value === 'ko', langSel.value);
  STORE.words = { ...savedWords, ...STORE.words };
  await choose('zh');
  check('choosing 中文 saves the language', STORE.lang === 'zh', STORE.lang);
  check('and the level bars use HSK',
        [...document.querySelectorAll('#ov-bars u')].map((u) => u.textContent).join()
          === `HSK 1,HSK 2,HSK 3,HSK 4,HSK 5,HSK 6,${DASH}`,
        [...document.querySelectorAll('#ov-bars u')].map((u) => u.textContent).join());
  check('and the session queue holds no English or Korean card',
        queue.every((e) => LANG.of(e).id === 'zh'),
        queue.map((e) => e.word).join());
  await choose('en');
  check('choosing English saves the language', STORE.lang === 'en', STORE.lang);
  check('and the words view is back to the English set',
        document.getElementById('ov-total').textContent === String(Object.keys(savedWords).length),
        document.getElementById('ov-total').textContent);
  // The queue is module state no render() reaches, so the refresh behind the
  // toggle has to rebuild it — otherwise the Korean card stays on screen under
  // an EN toggle.
  check('and the session queue holds no Korean card',
        queue.every((e) => LANG.of(e).id === 'en'),
        queue.map((e) => e.word).join());

  /* ---- the language moving by any path but the toggle ----
     setLang() is not the only writer of the key: lookupNew() follows a word into
     its own language, and a second dashboard tab reaches this one through
     storage.onChanged. Both used to call only refresh(), which never touched the
     queue — so the toggle read 한 while the card and the rest of the session
     were still English, which is the IME switch mid-session the filter exists to
     prevent. */
  check('the EN session has English cards in flight to go stale',
        queue.length > 0 && queue.every((e) => LANG.of(e).id === 'en'), String(queue.length));
  STORE.lang = 'ko';
  for (const f of listeners) f({ lang: { newValue: 'ko', oldValue: 'en' } }, 'local');
  await tick();
  check('a language change from another tab rebuilds the session queue',
        queue.length > 0 && queue.every((e) => LANG.of(e).id === 'ko'),
        queue.map((e) => e.word).join());
  check('so the card on screen is in the language the toggle now reads',
        langSel.value === 'ko'
        && LANG.of(queue[0]).id === activeLang,
        document.getElementById('rv-input').placeholder);

  // One change, two refreshes: setLang()'s own, and the one the onChanged
  // listener runs for the write setLang() just made. Rebuilding on both would
  // throw away a session that the first pass had already made correct.
  const realStart = startReview;
  let rebuilds = 0;
  window.startReview = (...args) => { rebuilds++; return realStart(...args); };
  await setLang('en');
  for (const f of listeners) f({ lang: { newValue: 'en', oldValue: 'ko' } }, 'local');
  await tick();
  window.startReview = realStart;
  check('two refreshes for one language change rebuild the queue once, not twice',
        rebuilds === 1, String(rebuilds));
  check('and it is the language just switched to that is queued',
        queue.length > 0 && queue.every((e) => LANG.of(e).id === 'en'), String(queue.length));

  STORE.words = savedWords;
  delete STORE.lang;

  /* ---- a stored language whose pack is gone ------------------------------
     getLang() resolves through LANG.get rather than trusting the key, so an
     id left behind by a pack that was removed falls back once, here, instead
     of throwing on every render. Nothing reached this branch before. */
  STORE.lang = 'zz';
  // getLang() directly, and deliberately NOT through refresh(): without the
  // guard, renderOverview's LANG.get(activeLang).levels throws, and this probe
  // drops every row it has collected when it throws — so the suite would go
  // red saying only "TypeError: reading 'levels'". Testing the function that
  // owns the branch keeps the failure named.
  check('an unknown language id falls back to English rather than throwing',
        (await getLang()) === LANG.FALLBACK, await getLang());
  check('and the key is left alone, which is not this function’s to fix',
        STORE.lang === 'zz', String(STORE.lang));
  delete STORE.lang;
  await refresh();

  /* ---- looking a word up follows it into its own language -----------------
     The words view's CTA dispatches on the SCRIPT of what you typed, so 책
     typed in an English session offers a Korean lookup — and the word would
     then save into a list this page is filtering out, which reads as the
     lookup having done nothing. lookupNew writes the key; refresh() re-reads
     it. resolveWord is stubbed the way pronounce is above: the branch under
     test is the follow, not the network. */
  const realResolve = window.resolveWord;
  window.resolveWord = async (word) => ({
    entry: { ...mk(word, { lang: 'ko', level: '초급', vi: 'sách' }), word }
  });
  const cta = document.createElement('button');
  await lookupNew('책', cta);
  check('looking up a Korean word from an English session switches the language',
        activeLang === 'ko', activeLang);
  check('and the key is written, so another tab follows too', STORE.lang === 'ko', String(STORE.lang));
  await setLang('en');
  window.resolveWord = async (word) => ({ entry: { ...mk(word), word } });
  await lookupNew('resilient', cta);
  check('a word in the language you are already in moves nothing',
        activeLang === 'en' && STORE.lang === 'en', `${activeLang}/${STORE.lang}`);
  window.resolveWord = realResolve;
  delete STORE.lang;
  await refresh();

  /* ---- a dictionary 404 still saves the word when a gloss covers it --------
     The Free Dictionary API (English now) 404s real words it simply lacks —
     "france" is the case that prompted this — so resolveWord must not abort the
     save on a not-found alone. It aborts only when the gloss is ALSO empty,
     which is a true non-word. fetchEntry and glossFor are stubbed the way
     resolveWord's own dependencies are; the real resolveWord runs against the
     storage stub. The senses check guards a real class of bug: newEntry reads
     `parsed.senses ?? []`, so a four-null parse stores [] — a future field
     added without the `?? []` would store undefined on every FD-404 word. */
  const realFetchEntry = window.fetchEntry;
  const realGlossFor = window.glossFor;
  window.fetchEntry = async () => ({ notFound: true });
  window.glossFor = async () => ({ vi: 'Pháp', failed: null });
  const saved404 = await resolveWord('francetest', 'https://e.com/a', [], 'a sentence', 'en');
  check('a 404 with a gloss still returns an entry', !!saved404.entry && !saved404.notFound,
        JSON.stringify(saved404).slice(0, 80));
  check('a 404 raises no dict warning — the word was absent, not a failure',
        saved404.failed?.dict === null, String(saved404.failed?.dict));
  check('the FD-404 word lands in storage with its gloss and a null level',
        STORE.words.francetest?.vi === 'Pháp' && STORE.words.francetest?.level === null,
        JSON.stringify(STORE.words.francetest)?.slice(0, 80));
  check('and its senses is an empty array, never undefined',
        Array.isArray(STORE.words.francetest?.senses) && STORE.words.francetest.senses.length === 0,
        String(STORE.words.francetest?.senses));

  window.glossFor = async () => ({ vi: null, failed: null });
  const missed404 = await resolveWord('zzjunkword', 'https://e.com/a', [], null, 'en');
  check('a 404 with no gloss is a real not-found', missed404.notFound === true,
        JSON.stringify(missed404).slice(0, 80));
  check('and nothing is saved for a true non-word', !STORE.words.zzjunkword);
  window.fetchEntry = realFetchEntry;
  window.glossFor = realGlossFor;
  delete STORE.words.francetest;

  /* ---- the GIF control on a words-list card --------------------------------
     This is the place the user kept looking. gifSection gates on the key the
     same way the review card does; wordCard is pure enough to call directly, so
     the three states are checked without rendering the whole view. VT.giphyOk is
     applied before an <img src>, including a url that arrived from an import. */
  giphyKey = '';
  const gifNoKey = wordCard(mk('gifword'));
  check('a word card with no key shows no GIF control (empty box collapses)',
        gifNoKey.querySelector('.wc-gif')?.childElementCount === 0,
        String(gifNoKey.querySelector('.wc-gif')?.childElementCount));
  giphyKey = 'TESTKEY123';
  const gifKey = wordCard(mk('gifword'));
  const gifBtn = gifKey.querySelector('.wc-gif button');
  check('a word card with a key shows a Find GIF button',
        !!gifBtn && /Find GIF/.test(gifBtn.textContent), gifBtn?.textContent);
  const gifStored = wordCard(mk('gifword', { gif: 'https://media.giphy.com/media/x/200.gif' }));
  check('a word card with a stored GIF shows the image',
        gifStored.querySelector('.wc-gif img')?.getAttribute('src') === 'https://media.giphy.com/media/x/200.gif');
  const gifEvil = wordCard(mk('gifword', { gif: 'https://evil.test/x.gif' }));
  check('an off-giphy stored url is never put in an img',
        !gifEvil.querySelector('.wc-gif img'));
  giphyKey = '';

  /* ---- CEFR backfill gives a level to English words that lost it ----------
     The lookup stopped carrying a CEFR level, so words saved in between sit under
     "—". backfillCefr reads the level from the bundled list (lang/en/cefr.js)
     once, keyed by a stored version flag; a word outside the list is left alone. */
  // Drain the boot's floating refresh().then(backfillCefr) first: it is pure
  // microtasks, so one macrotask boundary guarantees it has run and written its
  // version flag. Without this, its late write could land after the delete below
  // and this test would pass only by timing.
  await tick();
  const savedForCefr = STORE.words;
  delete STORE.cefrBackfill;
  STORE.words = {
    abandon: mk('abandon', { level: null }),
    frenchtownxyz: mk('frenchtownxyz', { level: null })
  };
  await refresh();
  await backfillCefr();
  check('backfill gives a listed English word its CEFR level',
        STORE.words.abandon?.level === 'B1', String(STORE.words.abandon?.level));
  check('backfill leaves an unlisted word with no level',
        !STORE.words.frenchtownxyz?.level);
  check('backfill records its version so it runs only once',
        STORE.cefrBackfill === 1, String(STORE.cefrBackfill));
  STORE.words = savedForCefr;
  delete STORE.cefrBackfill;
  await refresh();

  /* ---- the folder GRID is language-scoped, not just the counts on it ------
     The reported bug: a Korean session showed IELTS C1, IELTS C2, Phrasal A1
     and Phrasal A2 as empty cards, because render() filtered `words` by the
     active language and then built the grid from every folder in storage.
     Two of the three folders below carry no `lang` at all, which is the case
     that matters — `lang` is new and nobody's stored folders get migrated, so
     an old folder has to be placed by the words inside it. */
  const savedFolders = STORE.folders;
  STORE.folders = {
    ...STORE.folders,
    'ielts-c1': { id: 'ielts-c1', name: 'IELTS C1', auto: false, added: 1 },
    'ko-topik': { id: 'ko-topik', name: '초급', auto: false, added: 1 },
    'ko-named': { id: 'ko-named', name: '내 단어', auto: false, added: 1, lang: 'ko' }
  };
  STORE.words = {
    ...savedWords,
    gridEn: mk('gridEn', { folders: ['ielts-c1'] }),
    '신문': mk('신문', { lang: 'ko', folders: ['ko-topik'] })
  };
  showView('overview');
  await refresh();
  const gridIds = () => [...document.querySelectorAll('#ov-folders .f[data-folder]')]
    .map((el) => el.dataset.folder);
  check('an English session shows a folder whose words are English',
        gridIds().includes('ielts-c1'), gridIds().join());
  check('and hides a Korean folder that named its own language',
        !gridIds().includes('ko-named'), gridIds().join());
  await setLang('ko');
  check('flipping to Korean takes the English list folder off the grid',
        !gridIds().includes('ielts-c1'), gridIds().join());
  check('and keeps the Korean one, placed by the words in it',
        gridIds().includes('ko-topik'), gridIds().join());
  check('a folder that names its own language needs no words to be placed',
        gridIds().includes('ko-named'), gridIds().join());
  check('From reading is nobody\'s language and stays in both',
        gridIds().includes(VT.READING), gridIds().join());
  check('and the subtitle counts the folders on screen, not the ones in storage',
        document.getElementById('ov-sub').textContent.includes(`${gridIds().length} folder`),
        document.getElementById('ov-sub').textContent);
  await setLang('en');
  check('flipping back brings the English folder home',
        gridIds().includes('ielts-c1'), gridIds().join());

  /* The words view is one level down and has the same problem: its scope is a
     folder id, and the language moving under it would leave an English
     folder's name sitting over an empty list. */
  openFolder('ielts-c1');
  check('opening an English folder puts its name on the words view',
        document.getElementById('w-title').textContent === 'IELTS C1',
        document.getElementById('w-title').textContent);
  await setLang('ko');
  check('flipping language drops a folder scope this language cannot show',
        document.getElementById('w-title').textContent === 'All words',
        document.getElementById('w-title').textContent);
  await setLang('en');
  openFolder(VT.READING);
  await setLang('ko');
  check('but From reading is every language\'s and survives the flip',
        document.getElementById('w-title').textContent === 'From reading',
        document.getElementById('w-title').textContent);
  await setLang('en');
  openFolder(null);

  /* The tag picker is the other place a folder SET is rendered, and it is
     scoped to the card's language rather than the session's — a Korean card
     is reachable from an English session. Offering IELTS C1 for 신문 is worse
     than noise: filing it there would make that folder hold both languages,
     which reads as everyone's, and IELTS C1 would sit in the Korean overview
     from then on. */
  tagging = 'gridEn';
  const offered = () => tagOptions().map((t) => t.name);
  check('an English card is offered the English folder',
        offered().includes('IELTS C1'), offered().join());
  tagging = '신문';
  check('a Korean card is not',
        !offered().includes('IELTS C1'), offered().join());
  check('but it is offered the Korean one',
        offered().includes('초급'), offered().join());
  check('and the presets, which belong to no language yet',
        offered().includes(VT.TOPICS[0].name), offered().join());
  tagging = null;

  STORE.folders = savedFolders;
  STORE.words = savedWords;
  delete STORE.lang;
  await refresh();

  /* ---- "Learn N more" counts the cards that button is about to queue ----
     It reads the same inScope() startReview() queues from, so the other
     language's new words and the skipped ones are out of both. Pinned as
     agreement rather than as a bare number: the button's only job is to start
     the session it names, and a count that disagrees with it is the lie. */
  STORE.words.mix1 = mk('mix1', { folders: ['mixed'], due: Date.now() + 1e9 });
  STORE.words.mix2 = mk('mix2', { folders: ['mixed'], due: Date.now() + 1e9 });
  STORE.words.mix3 = mk('mix3', { folders: ['mixed'], due: Date.now() + 1e9, skipped: true });
  STORE.words['한글'] = mk('한글', { lang: 'ko', folders: ['mixed'], due: Date.now() + 1e9 });
  await refresh();
  queue = [];
  reviewScope = 'mixed';
  renderCard();
  const rvMore = document.getElementById('rv-more');
  check('“Learn N more” counts neither the other language nor a skipped word',
        rvMore.textContent === 'Learn 2 more', rvMore.textContent);
  rvMore.click();
  check('and the session it starts is exactly the cards it counted',
        queue.length === 2 && queue.every((e) => LANG.of(e).id === 'en' && !e.skipped),
        queue.map((e) => e.word).join());

  /* ---- overview: progress, pins, suggestions ---- */
  showView('overview');
  await refresh();
  const fcounts = document.querySelector("#ov-folders .fcounts");
  check('a folder card shows learned · learning · new',
        /^\d+ learned · \d+ learning · \d+ new$/.test(fcounts?.textContent ?? ""), fcounts?.textContent);
  check('nothing pinned: the Pinned section is hidden',
        !document.getElementById('ov-pinned-head').checkVisibility());
  check('a folder with due words is suggested, with its reason',
        /due today/.test(document.querySelector('#ov-suggest .why')?.textContent ?? ''),
        document.getElementById('ov-suggest').textContent.slice(0, 120));
  document.querySelector(`#ov-folders .f[data-folder="${VT.READING}"] .pin`).click();
  await tick();
  await refresh();
  check('📌 saves the pin', STORE.pins?.includes(VT.READING), JSON.stringify(STORE.pins));
  check('📌 moves the card up into Pinned',
        !!document.querySelector(`#ov-pinned .f[data-folder="${VT.READING}"]`)
        && !document.querySelector(`#ov-folders .f[data-folder="${VT.READING}"]`)
        && document.getElementById('ov-pinned-head').checkVisibility());
  check('a pinned folder is not suggested again',
        !document.querySelector(`#ov-suggest .f[data-folder="${VT.READING}"]`));
  document.querySelector(`#ov-pinned .f[data-folder="${VT.READING}"] .pin`).click();
  await tick();
  await refresh();
  check('📌 again unpins it', !STORE.pins.length && !document.getElementById('ov-pinned').checkVisibility());

  document.getElementById('out').textContent =
    log.join('\n') + `\n\n${failures} failure(s), ${log.length} check(s)`;
}, 80));
}
</script>
<script>
  ready.catch((err) => {
    document.getElementById('out').textContent =
      'FAIL probe setup: ' + err.message + '\n1 failure(s), 0 check(s)';
  });
</script>
<pre id="out">running…</pre>
</body>
