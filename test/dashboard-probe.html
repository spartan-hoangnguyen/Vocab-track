<!doctype html><meta charset="utf-8"><title>Vocab-track</title>
<link rel="stylesheet" href="../dashboard.css">
<body>
<!-- display:contents, so this wrapper adds no box of its own. dashboard.css
     lays the page out as a flex body with <aside> and <main> as its direct
     children; an ordinary <div> between them breaks that, and a probe whose
     whole job is measuring layout would then be measuring a box tree the
     product never renders. -->
<style>#app{display:contents}</style>
<div id="app"></div>
<script>
  // A probe that dies silently reports nothing and reads as a pass to anyone
  // skimming. Surface it in the one place run.sh looks.
  const died = (what) => {
    document.getElementById('out').textContent =
      'FAIL probe ' + what + '\n1 failure(s), 0 check(s)';
  };
  window.addEventListener('error', (e) => died('threw: ' + e.message + ' @' + e.filename + ':' + e.lineno));
  // Both, because the assertions run in an async callback: a throw in there is
  // a rejected promise, which never reaches the error event. Without this the
  // page sits on "running…" and run.sh reports nothing at all.
  window.addEventListener('unhandledrejection', (e) => died('rejected: ' + (e.reason?.stack ?? e.reason)));
</script>
<!-- The markup is the real dashboard.html, fetched rather than copied.
     It used to be a copy, and the copy silently went stale the moment the
     review card changed shape — a probe measuring markup the product no longer
     ships cannot catch anything. -->
<script>
  // dashboard.js binds its listeners at load, so the markup has to be in the
  // document before it runs. That ordering is why this page loads lib/store/
  // lookup/dashboard itself, at the bottom, instead of with <script src>: a
  // synchronous XMLHttpRequest would give the same ordering but stalls
  // headless Chrome's virtual clock, so the assertions' timer never fired and
  // the page sat on "running…" reporting nothing.
  const ready = fetch('../dashboard.html')
    .then((r) => r.text())
    .then((page) => {
      // Only what is inside <body>, and with its <script> tags stripped: this
      // page loads those itself, after the chrome stub exists.
      //
      // Appended, never assigned to document.body.innerHTML: replacing the
      // body while the parser is still inside it throws away every tag not yet
      // read, which silently took out this page's own scripts.
      const holder = document.createElement('div');
      holder.innerHTML =
        page.slice(page.indexOf('<body>') + 6, page.lastIndexOf('</body>'))
            .replace(/<script[\s\S]*?<\/script>/g, '');
      // Into a slot declared up front, not appended to the body. The fetch
      // resolves after parsing finishes, so appending would put the whole
      // dashboard after the results element at the foot of this page — and
      // run.sh reads the results by slicing between that element's tags, so it
      // would print the dashboard instead of the assertions.
      document.getElementById('app').replaceChildren(...holder.childNodes);
    })
    .then(() => { return ['../lib.js', '../store.js', '../lookup.js', '../dashboard.js']
      // Serial, not Promise.all: dashboard.js reads VT from lib.js at load.
      .reduce((chain, src) => chain.then(() => new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = () => reject(new Error('could not load ' + src));
        document.head.append(tag);
      })), Promise.resolve()); });
</script>

<script>
const WORDS = {};
const seed = [
  ['strategy','B2','ˈstræt.ə.dʒi','chiến lược','a detailed plan for achieving success in situations such as war, business or politics'],
  ['resilient','C1','rɪˈzɪl.i.ənt','kiên cường','able to quickly return to a previous good condition'],
  ['ubiquitous','C2','juːˈbɪk.wɪ.təs','phổ biến','seeming to be everywhere at the same time'],
  ['commemorate','C1','kəˈmem.ə.reɪt','tưởng niệm','to remember officially and give respect to a great person or event'],
  ['tentative','B2','ˈten.tə.tɪv','dè dặt','not certain or agreed, or uncertain and slightly nervous'],
  ['ambiguous','C1','æmˈbɪɡ.ju.əs','mơ hồ','having more than one possible meaning'],
  ['leverage','B2','ˈliː.vər.ɪdʒ','đòn bẩy','to use something you already have in order to achieve something new'],
  ['nuance','C1','ˈnjuː.ɑːns','sắc thái','a very slight difference in appearance, meaning or sound'],
  ['pragmatic','C1','præɡˈmæt.ɪk','thực dụng','solving problems in a sensible way that suits the conditions'],
  ['candid','C1','ˈkæn.dɪd','thẳng thắn','truthful and honest, especially about something difficult'],
  ['scarce','B2','skeəs','khan hiếm','not easy to find or get']
];
for (const [word, level, ipa, vi, def] of seed) {
  WORDS[word] = { word, level, ipa, vi, def, folders:['reading'], senses:[], synonyms:[], related:[],
    context: word === 'strategy'
      ? 'The company announced a new long-term strategy for the European market this morning.' : null,
    sources:['https://example.com/a'], added: Date.now() - 86400000,
    ease:2.5, interval:0, reps:0, due: Date.now() - 1000 };
}
const listeners = [];
// A real chrome.storage.local, minus persistence: get takes a key or an array
// of them and omits what is absent, which is the whole point of the writeOn
// tests — `{}` back from get is what "the user has never touched this" looks like.
const STORE = { words: WORDS };
window.chrome = {
  storage:{ local:{
      get: async (keys) => {
        const out = {};
        for (const k of (Array.isArray(keys) ? keys : [keys])) {
          if (k in STORE) out[k] = STORE[k];
        }
        return out;
      },
      set: async (patch) => { Object.assign(STORE, patch); } },
    onChanged:{ addListener:(f)=>listeners.push(f) } },
  runtime:{ sendNativeMessage: async () => { throw new Error('no host'); },
            sendMessage(){}, onMessage:{ addListener(){} } }
};
</script>

<script>
// Braced, so every helper below is block-scoped. These names sit in the same
// global script scope as lib.js, store.js, lookup.js and dashboard.js, and a
// bare `check` in this file collided with one added to dashboard.js — a
// SyntaxError that takes out the whole page rather than failing one assertion.
{
let failures = 0;
const log = [];
const check = (name, cond, detail) => {
  if (cond) log.push('PASS  ' + name);
  else { failures++; log.push('FAIL  ' + name + (detail ? '  -> ' + detail : '')); }
};
const cs = (el) => getComputedStyle(el);

// The markup and the four scripts are all fetched, so the assertions wait on
// that chain; the short timer after it is for the dashboard's own first render.
ready.then(() => setTimeout(async () => {
  /* ---- view switching ----
     The trap this guards: any author `display` on a view section beats the UA
     stylesheet's [hidden]{display:none}, so #view-review{display:flex} without
     a :not([hidden]) makes the review card render on top of every other view. */
  for (const target of VIEWS) {
    showView(target);
    for (const other of VIEWS) {
      const el = document.getElementById(`view-${other}`);
      const shown = cs(el).display !== 'none';
      check(`showView(${target}) ${other === target ? 'shows' : 'hides'} ${other}`,
            shown === (other === target), `display: ${cs(el).display}`);
    }
  }

  /* ---- the top bar must not offer Review while you are reviewing ---- */
  showView('review');
  check('the review CTA is hidden inside the review', document.getElementById('review-btn').hidden);
  showView('overview');
  check('the review CTA is back outside it', !document.getElementById('review-btn').hidden);

  /* ---- the search placeholder must not run under the shortcut badge ---- */
  const input = document.getElementById('q');
  const badge = document.querySelector('.search .kbd');
  const textEdge = input.getBoundingClientRect().right
    - parseFloat(cs(input).paddingRight);
  check('the search field reserves room for the ⌘K badge',
        textEdge <= badge.getBoundingClientRect().left + 1,
        `text ends at ${textEdge.toFixed(1)}, badge starts at ${badge.getBoundingClientRect().left.toFixed(1)}`);

  /* ---- the review card must use the viewport, not float in its top third ---- */
  startReview(null);
  showView('review');
  render();
  const card = document.getElementById('rv-card').getBoundingClientRect();
  const above = card.top;
  const below = window.innerHeight - card.bottom;
  check('the review card is on screen', card.height > 0 && card.top < window.innerHeight);
  // Centred, not top-anchored: before this work the card sat under the heading
  // with roughly three times as much empty space below it as above.
  check(`the review card is vertically centred (${above.toFixed(0)}px above, ${below.toFixed(0)}px below)`,
        Math.abs(above - below) < Math.max(above, below) * 0.6,
        `above ${above.toFixed(0)}, below ${below.toFixed(0)}`);

  /* ---- the typing card ----
     The prompt is the meaning and the answer is the word, so the single thing
     that must never be true is the word being on screen before you commit. */
  const cardBox = document.getElementById('rv-card');
  const typeBox = document.getElementById('rv-input');
  const wordEl = document.getElementById('rv-word');
  const answer = document.getElementById('rv-answer');

  check('the typing box is on the card and focused',
        !!typeBox && cs(document.getElementById('rv-type')).display !== 'none'
        && document.activeElement === typeBox,
        document.activeElement?.id);
  check('the answer block is hidden before you commit', answer.hidden);
  check('the word itself is not on screen', wordEl.textContent === '', JSON.stringify(wordEl.textContent));
  check('neither is its pronunciation',
        document.getElementById('rv-ipa').hidden && document.getElementById('rv-play').hidden);
  // A prompt containing its own answer is not a prompt. Every card here is
  // seeded from `strategy`, whose saved sentence uses the word.
  const shownContext = document.getElementById('rv-context').textContent;
  check('the saved sentence has the word masked out',
        !shownContext || !/\bstrategy\b/i.test(shownContext), shownContext);
  check('the typing row takes the card width, unlike the grade buttons',
        typeBox.getBoundingClientRect().width > cardBox.clientWidth * 0.4,
        `${typeBox.getBoundingClientRect().width.toFixed(0)}px of ${cardBox.clientWidth}px`);

  // Commit a wrong-but-close answer and read what the card says back.
  typeBox.value = 'strategyy';
  document.getElementById('rv-type').dispatchEvent(new Event('submit', { cancelable: true }));
  await new Promise((r) => setTimeout(r, 20));

  check('committing reveals the answer block', !answer.hidden);
  check('and the word', document.getElementById('rv-word').textContent.length > 0,
        document.getElementById('rv-word').textContent);
  // Computed display, not the .hidden property: the property was true the whole
  // time the row was still on screen, because an author display:flex outranks
  // the UA [hidden] rule. Asserting the property tested nothing.
  check('and the typing row is gone',
        cs(document.getElementById('rv-type')).display === 'none',
        cs(document.getElementById('rv-type')).display);
  const diff = document.getElementById('rv-diff');
  check('the diff marks only the wrong letters',
        diff.querySelectorAll('u').length === 1 && diff.querySelector('u').textContent === 'y',
        `${diff.querySelectorAll('u').length} marks, ${JSON.stringify(diff.querySelector('u')?.textContent)}`);
  check('a one-letter slip reads as almost, not as wrong',
        diff.className.includes('near'), diff.className);
  // Typing already said how well it went, so Enter has a grade to take.
  const picked = document.querySelectorAll('#rv-grades button.pick');
  check('exactly one grade is marked as the one Enter takes', picked.length === 1, picked.length);
  check('a near miss suggests Hard, not Good',
        picked[0]?.querySelector('b').textContent === 'Hard',
        picked[0]?.querySelector('b').textContent);
  check('every grade still carries its own key',
        [...document.querySelectorAll('#rv-grades button')].length === 4
        && [...document.querySelectorAll('#rv-grades button kbd')].length === 5,
        `${document.querySelectorAll('#rv-grades button kbd').length} keys`);
  // The box must not keep focus once the grades are live, or 1-4 would type
  // digits into it instead of grading.
  check('focus leaves the box so the number keys can grade',
        document.activeElement !== typeBox, document.activeElement?.id);

  /* ---- nav icons must be distinguishable from one another ---- */
  const icons = [...document.querySelectorAll('nav a svg')].map((el) => el.innerHTML);
  check('every nav item has its own icon',
        icons.length === 6 && new Set(icons).size === 6, `${new Set(icons).size} distinct of ${icons.length}`);

  /* ---- writing: the settings and the mistake list ----
     Driven through STORE + refresh() rather than the initial load, so each
     case states the storage it is asserting about. */
  const rows = () => [...document.querySelectorAll('#wr-mistakes li')];

  delete STORE.writeOn;
  delete STORE.writeOff;
  delete STORE.writeMistakes;
  await refresh();
  // The one that would ship the feature off for every existing profile.
  check('an absent writeOn renders the toggle as on', document.getElementById('wr-on').checked);
  check('an absent writeOff says checking is on everywhere',
        !document.getElementById('wr-hosts-empty').hidden
        && document.getElementById('wr-hosts').children.length === 0,
        `${document.getElementById('wr-hosts').children.length} host rows`);
  check('an absent writeMistakes shows the empty line and no panel',
        !document.getElementById('wr-mistakes-empty').hidden
        && document.getElementById('wr-mistakes').hidden,
        `${rows().length} rows`);

  STORE.writeOn = false;
  await refresh();
  check('writeOn false renders the toggle as off', !document.getElementById('wr-on').checked);

  STORE.writeOff = ['mail.google.com', 'docs.google.com'];
  await refresh();
  check('writeOff renders one removable row per host and hides the empty line',
        document.getElementById('wr-hosts').children.length === 2
        && document.getElementById('wr-hosts-empty').hidden
        && document.querySelectorAll('#wr-hosts .rowdel').length === 2);

  // 15 rules, counts 1..15, inserted in ascending order so insertion order is
  // the wrong answer and only a sort by n can pass.
  STORE.writeMistakes = {};
  for (let i = 1; i <= 15; i++) {
    STORE.writeMistakes[`RULE_${i}`] = { n: i, msg: `message ${i}`, cat: 'CONFUSED_WORDS' };
  }
  await refresh();
  const counts = rows().map((li) => Number(li.querySelector('.n').textContent));
  check('the mistake list caps at 12', counts.length === 12, `${counts.length} rows`);
  check('the mistake list is ordered by count, highest first',
        counts.length === 12 && counts[0] === 15
        && counts.every((n, i) => i === 0 || counts[i - 1] >= n),
        counts.join(','));
  check('the category is title-cased, not a raw rule id',
        rows()[0]?.querySelector('.tag').textContent === 'Confused Words',
        rows()[0]?.querySelector('.tag').textContent);
  // The count is the point of the panel; at body size it reads as a debug dump.
  check('the count reads as a stat, not as body text',
        parseFloat(cs(rows()[0].querySelector('.n')).fontSize) >= 20,
        cs(rows()[0].querySelector('.n')).fontSize);

  document.getElementById('out').textContent =
    log.join('\n') + `\n\n${failures} failure(s), ${log.length} check(s)`;
}, 80));
}
</script>
<script>
  ready.catch((err) => {
    document.getElementById('out').textContent =
      'FAIL probe setup: ' + err.message + '\n1 failure(s), 0 check(s)';
  });
</script>
<pre id="out">running…</pre>
</body>
