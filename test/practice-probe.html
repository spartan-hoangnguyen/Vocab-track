<!doctype html><meta charset="utf-8"><title>Vocab-track</title>
<link rel="stylesheet" href="../dashboard.css">
<link rel="stylesheet" href="../practice.css">
<link rel="stylesheet" href="../practice-quiz.css">
<link rel="stylesheet" href="../practice-listening.css">
<link rel="stylesheet" href="../practice-fill.css">
<link rel="stylesheet" href="../practice-speak.css">
<link rel="stylesheet" href="../practice-blast.css">
<body>
<!-- display:contents, so this wrapper adds no box of its own. dashboard.css
     lays the page out as a flex body with <aside> and <main> as its direct
     children; an ordinary <div> between them breaks that, and a probe whose
     whole job is measuring layout would then be measuring a box tree the
     product never renders. -->
<style>#app{display:contents}</style>
<div id="app"></div>
<script>
  // A probe that dies silently reports nothing and reads as a pass to anyone
  // skimming. Surface it in the one place run.sh looks.
  const died = (what) => {
    document.getElementById('out').textContent =
      'FAIL probe ' + what + '\n1 failure(s), 0 check(s)';
  };
  window.addEventListener('error', (e) => died('threw: ' + e.message + ' @' + e.filename + ':' + e.lineno));
  // Both, because the assertions run in an async callback: a throw in there is
  // a rejected promise, which never reaches the error event. Without this the
  // page sits on "running…" and run.sh reports nothing at all.
  window.addEventListener('unhandledrejection', (e) => died('rejected: ' + (e.reason?.stack ?? e.reason)));
</script>
<!-- The markup is the real dashboard.html, fetched rather than copied.
     It used to be a copy, and the copy silently went stale the moment the
     review card changed shape — a probe measuring markup the product no longer
     ships cannot catch anything. -->
<script>
  // dashboard.js binds its listeners at load, so the markup has to be in the
  // document before it runs. That ordering is why this page loads lib/store/
  // lookup/dashboard itself, at the bottom, instead of with <script src>: a
  // synchronous XMLHttpRequest would give the same ordering but stalls
  // headless Chrome's virtual clock, so the assertions' timer never fired and
  // the page sat on "running…" reporting nothing.
  const ready = fetch('../dashboard.html')
    .then((r) => r.text())
    .then((page) => {
      // Only what is inside <body>, and with its <script> tags stripped: this
      // page loads those itself, after the chrome stub exists.
      //
      // Appended, never assigned to document.body.innerHTML: replacing the
      // body while the parser is still inside it throws away every tag not yet
      // read, which silently took out this page's own scripts.
      const holder = document.createElement('div');
      holder.innerHTML =
        page.slice(page.indexOf('<body>') + 6, page.lastIndexOf('</body>'))
            .replace(/<script[\s\S]*?<\/script>/g, '');
      // Into a slot declared up front, not appended to the body. The fetch
      // resolves after parsing finishes, so appending would put the whole
      // dashboard after the results element at the foot of this page — and
      // run.sh reads the results by slicing between that element's tags, so it
      // would print the dashboard instead of the assertions.
      document.getElementById('app').replaceChildren(...holder.childNodes);
    })
    .then(() => { return ['../lib.js', '../lang/lang.js', '../lang/en/index.js', '../lang/ko/index.js', '../lang/en/dictionary.js', '../lang/ko/dictionary.js', '../store.js', '../lookup.js', '../practice.js',
      ...['quiz', 'listening', 'fill', 'speak', 'blast', 'mix'].map((m) => `../practice-${m}.js`),
      '../dashboard.js']
      // Serial, not Promise.all: dashboard.js reads VT from lib.js at load.
      .reduce((chain, src) => chain.then(() => new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = () => reject(new Error('could not load ' + src));
        document.head.append(tag);
      })), Promise.resolve()); });
</script>


<script>
// Fourteen words, every one with a gloss and a saved sentence that uses it, so
// every mode is open and the quiz has distractors at the same level. Twelve of
// them are overdue; the last two are the schedule rule's two negative cases and
// are re-dated below.
const WORDS = {};
const seed = [
  ['strategy','B2','chiến lược','The company announced a new long-term strategy for Europe.'],
  ['resilient','C1','kiên cường','Children are often remarkably resilient after a move.'],
  ['ubiquitous','C2','phổ biến','Phones have become ubiquitous in classrooms.'],
  ['commemorate','C1','tưởng niệm','A statue was built to commemorate the victims.'],
  ['tentative','B2','dè dặt','They reached a tentative agreement late on Friday.'],
  ['ambiguous','C1','mơ hồ','The wording of the law is deliberately ambiguous.'],
  ['leverage','B2','đòn bẩy','Small firms can leverage their local knowledge.'],
  ['nuance','C1','sắc thái','The translation loses every nuance of the original.'],
  ['pragmatic','C1','thực dụng','She took a pragmatic view of the budget.'],
  ['candid','C1','thẳng thắn','He gave a candid account of his mistakes.'],
  ['scarce','B2','khan hiếm','Water is scarce in the dry season.'],
  ['accelerate','B2','tăng tốc','The government wants to accelerate the move to clean energy.'],
  ['scaffold','C1','giàn giáo','Workers put up scaffold around the tower.'],
  ['kindle','B2','nhóm lửa','A single spark can kindle a whole forest.']
];
const DAY = 24 * 60 * 60 * 1000;
// The two words practice must not touch, and the reason the seed could not be
// twelve overdue rows: with every word due, the "not due, count it and stop"
// branch — the single most important clause in this change — never ran once.
const LATER = 'scaffold';   // introduced, but not due for a week
const FRESH = 'kindle';     // never introduced: an imported card held back
for (const [word, level, vi, context] of seed) {
  WORDS[word] = { word, level, vi, def: 'a definition of ' + word, ipa: 'x', context,
    folders: ['reading'], senses: [{ level, def: 'a definition of ' + word, example: null }],
    synonyms: [], related: [], sources: ['https://example.com/a'], added: Date.now() - 86400000,
    ease: 2.5, interval: 3, reps: 2, due: Date.now() - 1000 };
}
// Re-dates every word to the state the schedule checks start from. Called
// between graded sessions, because a session that works leaves nothing due.
function reseed() {
  for (const entry of Object.values(WORDS)) {
    delete entry.stability;
    delete entry.difficulty;
    delete entry.lastReview;
    entry.ease = 2.5;
    entry.reps = 2;
    entry.interval = 3;
    entry.due = Date.now() - 1000;
    if (entry.word === LATER) entry.due = Date.now() + 7 * DAY;
    if (entry.word === FRESH) { entry.reps = 0; entry.interval = 0; entry.due = Date.now() + 3 * DAY; }
  }
}
reseed();
const STORE = { words: WORDS };
window.chrome = {
  storage: { local: {
      get: async (keys) => {
        const out = {};
        for (const k of (Array.isArray(keys) ? keys : [keys])) if (k in STORE) out[k] = STORE[k];
        return out;
      },
      set: async (patch) => { Object.assign(STORE, patch); } },
    onChanged: { addListener() {} } },
  runtime: { sendNativeMessage: async () => { throw new Error('no host'); },
             sendMessage() {}, onMessage: { addListener() {} } }
};
// Nothing in a headless probe should make a sound or wait on one.
window.Audio = class { play() { return Promise.resolve(); } };
// getVoices is in the stub because Listening now asks it whether a card can be
// played at all, and headless Chrome reports no voices whatsoever. This is a
// machine with both languages installed, so the rows below measure eligibility
// rather than this page's furniture; the no-voice machine is stubbed inside
// listening's selfTest, which puts this back after each case.
window.speechSynthesis = { speak() {}, cancel() {},
  getVoices: () => [{ lang: 'en-GB' }, { lang: 'en-US' }, { lang: 'ko-KR' }] };
</script>

<script>
{
let failures = 0;
const log = [];
const check = (name, cond, detail) => {
  if (cond) log.push('PASS  ' + name);
  else { failures++; log.push('FAIL  ' + name + (detail ? '  -> ' + detail : '')); }
};
const tick = (ms = 5) => new Promise((r) => setTimeout(r, ms));
// stability and due, never `ease`: FSRS-6 writes stability, difficulty and
// lastReview (lib.js:160) and has not touched `ease` since the migration, so a
// snapshot of that field could not see a practice grade at all — which is the
// one thing these rows exist to watch.
const schedule = () => JSON.stringify(Object.values(STORE.words)
  .map((e) => [e.word, e.stability, e.interval, e.reps, e.due]));
const stamp = (word) => JSON.stringify([STORE.words[word].stability, STORE.words[word].due,
  STORE.words[word].reps, STORE.words[word].interval]);
const today = () => STORE['history:' + VT.dayKey(Date.now())] ?? [];
const tabs = () => [...document.querySelectorAll('#pr-tabs .prtab')];
const tabOf = (id) => document.querySelector(`#pr-tabs [data-mode="${id}"]`);
const panel = () => document.getElementById('pr-panel');
// The two words practice must leave alone, sampled after each reseed — reseed
// re-dates every row, so a stamp taken before one cannot be compared with a
// stamp taken after it.
const holdout = () => ({ [LATER]: stamp(LATER), [FRESH]: stamp(FRESH) });

ready.then(() => setTimeout(async () => {
  await refresh();
  startReview(null);
  showView('review');
  render();

  /* ---- the tab strip ---- */
  check('the strip shows the flashcard and all six modes, in the design order',
        tabs().map((t) => t.dataset.mode).join() === 'flashcard,quiz,listening,fill,speak,blast,mix',
        tabs().map((t) => t.dataset.mode).join());
  check('with fourteen glossed words in context, every mode is open',
        tabs().every((t) => t.getAttribute('aria-disabled') === 'false'),
        tabs().filter((t) => t.getAttribute('aria-disabled') === 'true').map((t) => t.dataset.mode).join());
  check('the flashcard is the tab you start on',
        tabOf('flashcard').getAttribute('aria-selected') === 'true');
  // It is in the review head, above what it swaps — the strip must not move
  // when the thing below it is replaced.
  check('the strip sits above the card, in the head',
        document.getElementById('pr-tabs').getBoundingClientRect().bottom
          <= document.getElementById('rv-card').getBoundingClientRect().top);
  // Both halves are inside the review section, and the <dialog id="practice-dlg">
  // that used to carry them is gone from the markup rather than merely unused:
  // a mode that opens over the card is a mode that moves the page under you,
  // which is the whole reason this moved. Checked against the real
  // dashboard.html this page fetches, so a dialog left behind would show here.
  check('practice is part of the review, not a dialog over it',
        !document.querySelector('dialog#practice-dlg, .prdlg, dialog .prtabs')
        && !!document.getElementById('pr-tabs').closest('#view-review')
        && !!document.getElementById('pr-panel').closest('.rvbody'),
        document.querySelector('dialog#practice-dlg, .prdlg')?.outerHTML.slice(0, 80)
          ?? 'the strip or the panel is outside the review body');

  /* ---- drawing the strip never builds a question ----
     Eligibility runs for every word on every render, and Mix repeats it.
     Calling quizOptions there (a full pool shuffle per word) made this O(n²):
     ten seconds a render at 3,000 words, felt as lag everywhere. */
  const realOptions = VT.quizOptions;
  const realShuffled = VT.shuffled;
  let built = 0;
  VT.quizOptions = (...a) => { built++; return realOptions(...a); };
  // The shuffle as well as the option builder, because quizOptions is no longer
  // the only way a question gets made: quiz builds its reverse distractors with
  // a wordOptions of its own (practice-quiz.js:269) and fill draws its sentence
  // (practice-fill.js:35) — both through VT.shuffled, which no eligible() has
  // any reason to touch. Watching the one primitive they share is what keeps
  // this row honest as the modes grow.
  VT.shuffled = (...a) => { built++; return realShuffled(...a); };
  PRACTICE.renderTabs(document.createElement('div'), practicePool(Object.values(words)), {});
  VT.quizOptions = realOptions;
  VT.shuffled = realShuffled;
  check('rendering the strip builds no question, in any mode', built === 0, `${built} calls`);

  /* ---- a scope with too few words greys the tab, with the reason reachable ---- */
  const tiny = Object.values(STORE.words).slice(0, 2);
  const host = document.createElement('div');
  PRACTICE.renderTabs(host, tiny, {});
  const quizTab = host.querySelector('[data-mode="quiz"]');
  check('a mode that cannot run is aria-disabled, not disabled',
        quizTab.getAttribute('aria-disabled') === 'true' && !quizTab.disabled,
        quizTab.outerHTML.slice(0, 120));
  // disabled would drop it out of the tab order and take the reason with it.
  check('and it is still reachable by Tab, which is how the reason is read',
        quizTab.tabIndex === 0, String(quizTab.tabIndex));
  check('and its reason is on the label, not only in a hover title',
        /four words/i.test(quizTab.getAttribute('aria-label')), quizTab.getAttribute('aria-label'));
  // aria-disabled is a promise to a screen reader and nothing at all to the
  // browser: a reachable tab still takes a click, so the refusal has to be in
  // pick() (practice.js:206). Drawn on the LIVE strip, because that is the one
  // pick() reads, and redrawn from the real pool afterwards so the tab clicks
  // below are not left asking about two words.
  const strip = document.getElementById('pr-tabs');
  PRACTICE.renderTabs(strip, tiny, {});
  PRACTICE.pick('quiz');
  await tick(20);
  check('and clicking it anyway starts nothing',
        !PRACTICE.active() && panel().hidden, String(PRACTICE.active()));
  PRACTICE.renderTabs(strip, practicePool(Object.values(words)), {});

  /* ---- eligibility asks the word's own pack ---- */
  const listening = PRACTICE.list().find((m) => m.id === 'listening');
  check('a saved phrase is still something you can hear and type',
        listening.eligible({ word: 'give up', lang: 'en' }));
  check('and a Korean word is too, which the old ASCII rule could not allow',
        listening.eligible({ word: '책', lang: 'ko' }));
  check('a bare initial is not a word to dictate',
        !listening.eligible({ word: 'a b', lang: 'en' }));
  // The hyphen is INSIDE the word, and en's isCandidate already allows it.
  // Splitting the word on it applied the two-letter minimum to each half and
  // dropped every one of these out of Listening without a word said.
  check('a hyphenated word with a one-letter part is still a word',
        ['x-ray', 'e-mail', 't-shirt', 'u-turn', 'a-list']
          .every((w) => listening.eligible({ word: w, lang: 'en' })),
        ['x-ray', 'e-mail', 't-shirt', 'u-turn', 'a-list']
          .filter((w) => !listening.eligible({ word: w, lang: 'en' })).join());

  // The pack is what carries the forms and the matching, so a word passed with
  // one explicitly is graded by that language's rules — the seam practice-speak
  // uses to grade a card it was handed.
  const hit = SPEAK.findWord('The car accelerates up the steep hill', 'accelerate', LANG.get('en'));
  check('speak finds the inflected form, keeping the spelling that was said',
        hit?.index === 8 && hit?.text === 'accelerates', JSON.stringify(hit));

  /* ---- a whole session, answered right, and what it does to the schedule ----
     Every question, not ten of them: with twelve words overdue a ten-question
     round never reaches the two that are not, and those two ARE the rule. */
  await setReviewPrefs({ practiceSession: 0 });

  // Listening hides the word — that is the mode — so the only way to answer it
  // is the same way you do: by hearing it. The speak hook is where the entry
  // passes through.
  const heard = [];
  const realSpeak = PRACTICE.hooks.speak;
  PRACTICE.hooks.speak = (entry) => { heard.push(entry); return realSpeak(entry); };

  // Plays one session to its summary, answering every question correctly.
  async function playThrough() {
    for (let step = 0; step < 300; step++) {
      const body = panel();
      if (body.querySelector('.prsummary')) return true;
      const go = body.querySelector('.prverdict .btn');
      if (go) { go.click(); await tick(); continue; }
      const options = [...body.querySelectorAll('.propts button')];
      if (options.length && !options[0].disabled) {
        const asked = body.querySelector('.prask')?.textContent;
        const gloss = VT.glossOf(STORE.words[asked]);
        // The <kbd> digit is the first character; the rest is the gloss.
        (options.find((b) => b.textContent.slice(1) === gloss) ?? options[0]).click();
        await tick();
        continue;
      }
      const box = body.querySelector('form .prinput');
      if (box && !box.disabled) {
        box.value = heard[heard.length - 1]?.word ?? '';
        box.form.requestSubmit();
        await tick();
        continue;
      }
      await tick();
    }
    return false;
  }

  // Listening produces the word, so a right answer is Good — and Easy when it
  // is fast. `fast` is a mode field rather than one shell constant precisely so
  // a mode can be driven at either end of it.
  const listenMode = PRACTICE.modes.get('listening');
  const realFast = listenMode.fast;
  listenMode.fast = 0;
  reseed();
  await refresh();
  let untouched = holdout();
  PRACTICE.start('listening', practicePool(Object.values(words)));
  await tick(20);
  const finishedListening = await playThrough();
  check('a listening session runs to its summary', finishedListening);
  check('a word that is due moves: stability and due are written',
        STORE.words.strategy.stability > 0 && STORE.words.strategy.due > Date.now(),
        stamp('strategy'));
  check('and it is logged as a review, graded Good — producing the word is what the card asks for',
        today().some(([w, q]) => w === 'strategy' && q === 4),
        JSON.stringify(today().filter(([w]) => w === 'strategy')));
  check('a word that is not due for a week is left exactly where it was',
        stamp(LATER) === untouched[LATER], `${stamp(LATER)} was ${untouched[LATER]}`);
  check('and a word never introduced is never begun by practice',
        stamp(FRESH) === untouched[FRESH], `${stamp(FRESH)} was ${untouched[FRESH]}`);
  check('neither of them is logged as a review',
        !today().some(([w]) => w === LATER || w === FRESH),
        JSON.stringify(today().filter(([w]) => w === LATER || w === FRESH)));
  PRACTICE.stop();

  // The same mode, answered just as fast, with the fast window back: producing
  // the word quickly is Easy.
  listenMode.fast = realFast;
  reseed();
  await refresh();
  PRACTICE.start('listening', practicePool(Object.values(words)));
  await tick(20);
  await playThrough();
  check('the same answer inside the fast window is Easy',
        today().some(([w, q]) => w === 'resilient' && q === 5),
        JSON.stringify(today().filter(([w]) => w === 'resilient')));
  PRACTICE.stop();

  // And the verdict bar is reading time, not thinking time. Every mode ends
  // `return ctx.next(ok, …)`, and next() only resolves on Continue, so a clock
  // read where ask() resolves would make "fast" mean "answered AND dismissed
  // inside the window" — Easy would be all but unreachable in real use, while
  // a test that clicks Continue instantly would never notice.
  reseed();
  await refresh();
  listenMode.fast = 400;
  const beforeSlow = today().length;
  PRACTICE.start('listening', practicePool(Object.values(words)), [STORE.words.candid]);
  await tick(30);
  const quickBox = panel().querySelector('form .prinput');
  quickBox.value = heard[heard.length - 1]?.word ?? '';
  quickBox.form.requestSubmit();
  await tick(30);
  // Dawdle, well past the window the answer itself landed inside.
  await tick(700);
  panel().querySelector('.prverdict .btn')?.click();
  await tick(30);
  const slow = today().slice(beforeSlow);
  check('reading the verdict slowly does not cost the Easy the answer earned',
        slow.length === 1 && slow[0][0] === 'candid' && slow[0][1] === 5,
        JSON.stringify(slow));
  PRACTICE.stop();
  listenMode.fast = realFast;

  // The same mode again, the same speed again, with the hint taken first. A
  // hint is help, so the answer caps at Hard however well it was produced —
  // which is only worth checking from the end that would otherwise be Easy:
  // capping a mode that already grades 3 proves nothing. One word, handed to
  // start() as its `only` queue, so the row this reads is unmistakably its own.
  reseed();
  await refresh();
  const beforeHint = today().length;
  PRACTICE.start('listening', practicePool(Object.values(words)), [STORE.words.candid]);
  await tick(30);
  panel().querySelector('.prhintbtn').click();
  await playThrough();
  const fromHint = today().slice(beforeHint);
  check('a hint caps the grade at Hard, in the mode that would have earned Easy',
        fromHint.length === 1 && fromHint[0][0] === 'candid' && fromHint[0][1] === 3,
        JSON.stringify(fromHint));
  PRACTICE.stop();
  PRACTICE.hooks.speak = realSpeak;

  // Quiz is recognition: four options, so a right answer caps at Hard.
  reseed();
  await refresh();
  untouched = holdout();
  // Only the rows this session writes: the two listening rounds above graded
  // the same words today, and "never Good" has to mean never from HERE.
  const beforeQuiz = today().length;
  PRACTICE.start('quiz', practicePool(Object.values(words)));
  await tick(20);
  const finishedQuiz = await playThrough();
  const fromQuiz = today().slice(beforeQuiz);
  check('a quiz session runs to its summary', finishedQuiz);
  check('picking the right meaning is graded Hard, never Good or Easy',
        fromQuiz.length > 0 && fromQuiz.every(([, q]) => q === 3),
        JSON.stringify(fromQuiz.slice(0, 4)));
  check('a quiz round still leaves the not-yet-due words alone',
        stamp(LATER) === untouched[LATER] && stamp(FRESH) === untouched[FRESH],
        stamp(LATER) + ' / ' + stamp(FRESH));
  PRACTICE.stop();

  // A game never moves anything, however it goes — and that has to be read off
  // a round that was actually played. A round left to idle records nothing at
  // all, so it passed this row whether or not a blasted card grades; the card
  // on screen is blasted here first, and the count is what proves the answer
  // landed rather than being dropped on the floor.
  reseed();
  await refresh();
  const beforeBlast = schedule();
  const blastRows = today().length;
  const blastBefore = (await getPractice()).counts.blast?.total ?? 0;
  PRACTICE.start('blast', practicePool(Object.values(words)));
  await tick(40);
  const falling = Object.values(STORE.words).find((e) =>
    VT.glossOf(e) === panel().querySelector('.pr-blast .blcard .bltext')?.textContent);
  const blastBox = panel().querySelector('.pr-blast input');
  blastBox.value = falling?.word ?? '';
  blastBox.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await tick(20);
  check('a card blasted out of the sky is counted as practice',
        ((await getPractice()).counts.blast?.total ?? 0) === blastBefore + 1,
        `${(await getPractice()).counts.blast?.total} was ${blastBefore}, card ${falling?.word}`);
  check('and a game still never moves the schedule at all', schedule() === beforeBlast);
  check('nor writes the answer down as a review',
        today().length === blastRows, `${today().length} rows, was ${blastRows}`);
  PRACTICE.stop();
  await tick();

  reseed();
  await refresh();
  await setReviewPrefs({ practiceSession: 10 });

  /* ---- every mode opens in the panel, and owns the keyboard ---- */
  const queued = queue.length;
  for (const mode of PRACTICE.list()) {
    PRACTICE.start(mode.id, practicePool(Object.values(words)));
    await tick(30);
    check(`${mode.id}: opens in the practice panel`,
          !panel().hidden && panel().querySelector('.prbody').children.length > 0);
    check(`${mode.id}: its tab is the selected one`,
          tabOf(mode.id).getAttribute('aria-selected') === 'true');
    for (const key of ['1', '2', '3', '4', 'r', 't', ' ']) {
      document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
    }
    await tick(30);
    // The review's own handler stands down: those digits are its grade keys,
    // and grade() is the only thing that shortens this queue.
    check(`${mode.id}: review keys do not grade the card behind it`,
          queue.length === queued, `${queue.length} vs ${queued}`);
    PRACTICE.stop();
    await tick(30);
  }
  check('stopping puts the panel away', panel().hidden);

  /* ---- Space replays what the question said, and only that ---- */
  const replayed = [];
  const beforeReplay = PRACTICE.hooks.speak;
  PRACTICE.hooks.speak = (entry) => { replayed.push(entry.word); return beforeReplay(entry); };
  PRACTICE.start('listening', practicePool(Object.values(words)));
  await tick(20);
  const saidOnShow = replayed.length;
  // Out of the box first: inside it, every key including Space is the box's.
  panel().querySelector('.prinput').blur();
  panel().querySelector('.prbody').dispatchEvent(
    new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true }));
  await tick();
  check('Space says the word again', replayed.length === saidOnShow + 1
        && replayed[replayed.length - 1] === replayed[saidOnShow - 1],
        JSON.stringify(replayed));
  PRACTICE.stop();
  // Fill never speaks before the answer, so there is nothing to replay and
  // Space must not invent something to say.
  PRACTICE.start('fill', practicePool(Object.values(words)));
  await tick(20);
  const quiet = replayed.length;
  panel().querySelector('.prbody').dispatchEvent(
    new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true }));
  await tick();
  check('and says nothing in a mode that never spoke', replayed.length === quiet);
  PRACTICE.stop();
  PRACTICE.hooks.speak = beforeReplay;

  /* ---- answers are counted per mode per day ---- */
  await recordPractice('quiz', 'strategy', false);
  await recordPractice('quiz', 'nuance', true);
  const p = await getPractice();
  check('practice counts today per mode', p.counts.quiz?.total >= 2 && p.counts.quiz?.right >= 1,
        JSON.stringify(p.counts.quiz));
  check('and remembers the words you missed', p.misses.strategy >= 1);
  await PRACTICE.hooks.changed();
  const badge = tabOf('quiz').querySelector('.prbadge');
  check('the badge counts it', !badge.hidden && /\d/.test(badge.textContent), badge.textContent);

  /* ---- the miss tally bands the queue rather than only reporting it ----
     Due is worth two bands and each miss one, capped at three, so a word you
     have got wrong three times outranks a due word you have never missed —
     which is the point: VT.shuffled treated those two exactly alike. */
  const banded = PRACTICE.weighted(
    [{ word: 'clean', due: Date.now() + DAY },
     { word: 'missed', due: Date.now() + DAY },
     { word: 'due', due: Date.now() - 1 },
     { word: 'both', due: Date.now() - 1 }],
    { missed: 3, both: 2 });
  check('the queue is banded by due date and by how often you have missed it',
        banded.map((e) => e.word).join() === 'both,missed,due,clean',
        banded.map((e) => e.word).join());

  /* ---- Starred: a built-in folder like From reading ---- */
  const folderList = await getFolders();
  check('Starred is always there', folderList[VT.STARRED]?.auto === true);
  await removeFolder(VT.STARRED);
  check('and cannot be deleted', !!(await getFolders())[VT.STARRED]);

  /* ---- each mode's own checks ---- */
  reseed();
  await refresh();
  const beforeSelfTests = schedule();
  for (const mode of PRACTICE.list()) {
    try {
      const results = (await mode.selfTest?.()) ?? [];
      for (const [name, ok, detail] of results) check(`${mode.id}: ${name}`, ok, detail);
    } catch (err) {
      check(`${mode.id}: selfTest runs`, false, err?.stack ?? String(err));
    }
    PRACTICE.stop();
  }
  // A selfTest drives questions through a host of its own with a ctx of its
  // own, so none of them reaches the shell's recorder — and none may reach the
  // schedule by another route either.
  check('no selfTest touched the review schedule', schedule() === beforeSelfTests);

  document.getElementById('out').textContent =
    log.join('\n') + `\n\n${failures} failure(s), ${log.length} check(s)`;
}, 80));
}
</script>
<script>
  ready.catch((err) => {
    document.getElementById('out').textContent =
      'FAIL probe setup: ' + err.message + '\n1 failure(s), 0 check(s)';
  });
</script>
<pre id="out">running…</pre>
</body>
