        <ellipse cx="59" cy="24" rx="3.8" ry="7" transform="rotate(-30 59 24)"/>
        <ellipse cx="69" cy="24" rx="3.8" ry="7" transform="rotate(30 69 24)"/>
        <ellipse cx="59" cy="33" rx="3.8" ry="7" transform="rotate(-30 59 33)"/>
        <ellipse cx="69" cy="33" rx="3.8" ry="7" transform="rotate(30 69 33)"/>
        <ellipse cx="59" cy="42" rx="3.8" ry="7" transform="rotate(-30 59 42)"/>
